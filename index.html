:root{color-scheme:dark;--ink:#edf4ff;--muted:#a1b4d6;--line:#a7bdff25}*{box-sizing:border-box}body{margin:0;background:#080f24;color:var(--ink);font-family:'Space Grotesk','Noto Sans Thai',sans-serif;font-size:16px}body:before{content:'';position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 80% 8%,#5946b52e,transparent 50%),radial-gradient(ellipse at 10% 35%,#1573b52b,transparent 55%)}.stars{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(1px 1px at 12% 21%,#c3dfff 98%,transparent),radial-gradient(2px 2px at 73% 15%,#bcaaff 98%,transparent),radial-gradient(1px 1px at 42% 60%,#fff 98%,transparent),radial-gradient(1px 1px at 87% 67%,#fff 98%,transparent);background-size:310px 280px;opacity:.5}nav,main,footer{max-width:1180px;margin:auto;padding:0 32px}nav{height:90px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:12px;font-size:20px;letter-spacing:4px;font-weight:700}.mark{height:36px;width:36px;border:1px solid #8acfff;border-radius:50%;display:grid;place-items:center;color:#9ed9ff;letter-spacing:0}.nav-caption{font-size:13px;color:var(--muted);letter-spacing:2px}.hero{position:relative;padding:78px 0 64px;overflow:hidden}.eyebrow{font-size:13px;letter-spacing:3px;color:#9cd8ff}.hero h1{font-size:clamp(70px,13vw,140px);line-height:1;margin:24px 0 14px;letter-spacing:-6px;background:linear-gradient(120deg,#fff 5%,#a7dfff 45%,#b2a5ff);background-clip:text;color:transparent}.hero h2{font-size:clamp(18px,3vw,27px);font-weight:400;letter-spacing:2px;margin:0 0 16px}.hero p{color:var(--muted);margin:0;line-height:1.9}.orbit{position:absolute;width:350px;height:350px;right:20px;top:45px;border:1px solid #829dff30;border-radius:50%;transform:rotate(-25deg);pointer-events:none}.orbit:before{content:'';position:absolute;inset:40px -50px;border:1px solid #87caff33;border-radius:50%;transform:rotate(-30deg)}.orbit:after{content:'✦';position:absolute;right:40px;top:30px;color:#a9d7ff;font-size:40px;text-shadow:0 0 30px #92aaff}.directory{position:relative;border-top:1px solid var(--line);padding:34px 0 64px}.section-top{display:flex;justify-content:space-between;gap:24px;align-items:center;margin-bottom:24px}.section-top h2{margin:0 0 7px;font-size:25px}.section-top p{margin:0;color:var(--muted);font-size:14px}.search-wrap{position:relative;width:340px;max-width:100%}.search-wrap span{position:absolute;left:16px;top:14px;color:#a3bded}input{width:100%;background:#111e3c;border:1px solid #7899d64a;padding:14px 16px 14px 42px;border-radius:12px;font:inherit;color:white;outline:none}input:focus{border-color:#9bd9ff;box-shadow:0 0 0 3px #8acbff22}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:linear-gradient(145deg,#152443d9,#10182fd9);border:1px solid var(--line);border-radius:17px;padding:24px;transition:border-color .2s,transform .2s}.card:hover{border-color:#8db5f977;transform:translateY(-2px)}.card-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:22px}.symbol{color:#a9cfff;font-size:24px;line-height:1}.count{color:#a3b8dc;font-size:13px}.card h3{font-size:18px;font-weight:500;margin:0 0 6px;line-height:1.6}.en{font-size:13px;color:#9bacd6;min-height:18px;letter-spacing:.6px}.codes{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}button{font:inherit;cursor:pointer}.code{border:1px solid #7798ce3b;background:#1a2c4c;color:#d3e9ff;border-radius:8px;padding:9px 10px;font-size:16px;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}.code:hover{background:#2b4671;border-color:#95d5ff}.code small{color:#c5b4ff;font-size:12px}.copy-icon{font-size:12px;opacity:.55}.empty{padding:60px 20px;text-align:center;color:var(--muted);grid-column:1/-1}footer{border-top:1px solid var(--line);padding-top:25px;padding-bottom:30px;display:flex;justify-content:space-between;gap:20px;color:var(--muted);font-size:13px;line-height:1.9}.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);padding:12px 22px;background:#d2eaff;color:#0b2144;border-radius:12px;box-shadow:0 10px 50px #0008;z-index:5}.toast[hidden]{display:none}:focus-visible{outline:2px solid #b6dcff;outline-offset:4px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.orbit{right:-150px;opacity:.5}.hero{padding-top:60px}}@media(max-width:560px){nav,main,footer{padding-left:20px;padding-right:20px}.nav-caption{font-size:10px;letter-spacing:1px}.grid{grid-template-columns:1fr}.section-top{align-items:stretch;flex-direction:column}.search-wrap{width:100%}.hero h2{letter-spacing:0}.hero{padding-bottom:45px}.orbit{right:-235px}.card{padding:22px}footer{flex-direction:column;gap:6px}}
</style></head><body><nav><div class="brand"><span class="mark" aria-hidden="true">✧</span>SSS</div><span class="nav-caption">TORAM ONLINE · GUILD</span></nav><main><header class="hero"><div class="stars"></div><div class="orbit"></div><div class="eyebrow">BENEATH THE SAME SILENT SKY</div><h1>SSS</h1><h2>Seeker of Silent Skies</h2><p>ผู้ตามหาผืนฟ้าอันเงียบสงบ</p></header><section class="directory" aria-labelledby="directory-title"><div class="section-top"><div><h2 id="directory-title">บัฟบ้านใต้ผืนฟ้าเดียวกัน</h2><p id="summary"></p></div><div class="search-wrap"><span aria-hidden="true">⌕</span><input id="search" aria-label="ค้นหาชื่อบัฟหรือเลขบ้าน" placeholder="ค้นหาบัฟ หรือเลขบ้าน…" type="search"></div></div><div id="grid" class="grid"></div></section></main><footer><span>SSS · Seeker of Silent Skies<br>ผู้ตามหาผืนฟ้าอันเงียบสงบ</span><span>คัดจากช่องสีเขียวในชีท · 25 พ.ย. 2026<br>สถานะอาหารอาจเปลี่ยนแปลงหลังบันทึกข้อมูล</span></footer><div id="toast" class="toast" role="status" hidden></div><script>const BUFFS = [{"name":"ฟื้น MP เมื่อโจมตี (AMPR)","codes":["1010017","7123456","4261111","1010058","7257777"]},{"name":"อัตราคริติคอล (Critical Rate)","codes":["1220709","1100000","1037777","5010098"]},{"name":"MP สูงสุด (MaxMP)","codes":["1010216","1100017","1032222","1240000","1014999","3190038"]},{"name":"พลังโจมตีอาวุธ (Weapon ATK)","codes":["7123456","2010136","6269999","1011126","1010810","3010018","1101111"]},{"name":"HP สูงสุด (MaxHP)","codes":["4262222"]},{"name":"STR","codes":["5261919","1110033"]},{"name":"DEX","codes":["1010058","5010092","7100666(Lv7)","1010216(Lv9)"]},{"name":"INT","codes":["6010701","1190020"]},{"name":"AGI","codes":["1110033","4262222"]},{"name":"VIT","codes":["4032850"]},{"name":"ต้านทานกายภาพ (Physical Resistance)","codes":["9090907","1020001","6010701"]},{"name":"ต้านทานเวท (Magic Resistance)","codes":["5066605","1111575","9090907(Lv9)","6234567","3158668","1010147(Lv3)"]},{"name":"ลดความเกลียดชัง (Aggro −)","codes":["1220709","1010147","3190038"]},{"name":"เพิ่มความเกลียดชัง (Aggro +)","codes":["1011340","2010136"]},{"name":"พลังโจมตี (ATK)","codes":["1119876","2030666(Lv6)"]},{"name":"พลังโจมตีเวท (MATK)","codes":["2030666"]},{"name":"แรงต่อธาตุดิน (DTE Earth)","codes":["7100666","5261919(Lv3)","5010092"]},{"name":"แรงต่อธาตุมืด (DTE Dark)","codes":["1190020","5010092"]},{"name":"เพิ่ม EXP (EXP Gain)","codes":["4032850"]},{"name":"ต้านทานไฟ (Fire Resistance)","codes":["1020001(Lv6)"]},{"name":"ต้านทานดิน (Earth Resistance)","codes":["6150029"]},{"name":"บาเรียความเสียหายตามสัดส่วน (Fractional Barrier)","codes":["6150029"]},{"name":"ความแม่นยำ (Accuracy)","codes":["4261111"]}];
</script><script>
const grid=document.querySelector('#grid'),search=document.querySelector('#search'),summary=document.querySelector('#summary'),toast=document.querySelector('#toast');let timer;
function render(){const q=search.value.trim().toLowerCase();const rows=BUFFS.filter(r=>(r.name+' '+r.codes.join(' ')).toLowerCase().includes(q));grid.replaceChildren();summary.textContent=rows.length+' บัฟ · แตะเลขบ้านเพื่อคัดลอก';for(const row of rows){const card=document.createElement('article');card.className='card';const match=row.name.match(/^(.*?)\s*\((.*?)\)$/);const title=match?match[1]:row.name;const en=match?match[2]:'CHARACTER STAT';const head=document.createElement('div');head.className='card-head';head.innerHTML='<span class="symbol" aria-hidden="true">✧</span><span class="count">'+row.codes.length+' เลขบ้าน</span>';card.append(head);const h=document.createElement('h3');h.textContent=title;card.append(h);const e=document.createElement('div');e.className='en';e.textContent=en;card.append(e);const codes=document.createElement('div');codes.className='codes';for(const raw of row.codes){const m=raw.match(/^(\d+)(?:\s*\((.*?)\))?$/);const code=m?m[1]:raw;const b=document.createElement('button');b.className='code';b.type='button';b.setAttribute('aria-label','คัดลอกเลขบ้าน '+code+' สำหรับ '+row.name);b.append(document.createTextNode(code));if(m?.[2]){const lv=document.createElement('small');lv.textContent=m[2];b.append(lv)}const icon=document.createElement('span');icon.className='copy-icon';icon.setAttribute('aria-hidden','true');icon.textContent='⧉';b.append(icon);b.onclick=async()=>{try{await navigator.clipboard.writeText(code);notify('คัดลอก '+code+' แล้ว')}catch{const t=document.createElement('textarea');t.value=code;document.body.append(t);t.select();const ok=document.execCommand('copy');t.remove();notify(ok?'คัดลอก '+code+' แล้ว':'คัดลอกไม่ได้ กรุณาคัดลอกเลข '+code+' ด้วยตนเอง')}};codes.append(b)}card.append(codes);grid.append(card)}if(!rows.length){const p=document.createElement('p');p.className='empty';p.textContent='ไม่พบบัฟหรือเลขบ้านที่ค้นหา ลองคำอื่นอีกครั้งนะ';grid.append(p)}}function notify(t){clearTimeout(timer);toast.textContent=t;toast.hidden=false;timer=setTimeout(()=>toast.hidden=true,2400)}search.addEventListener('input',render);render();
</script>

<script>
(function(){
 const endpoint=window.SSS_FEED_URL;
 if(!endpoint || !/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(endpoint)) return;
 const foot=document.querySelector('footer > span:last-child');
 let pending=false, timer, active;
 function cleanup(){clearTimeout(timer);if(active){active.remove();active=null;}pending=false;}
 function failed(){cleanup();foot.textContent='เชื่อมต่อชีทไม่ได้ · กำลังแสดงข้อมูลล่าสุดที่มี';}
 window.sssFoodBuffs=function(payload){
   if(!pending)return;
   if(!payload || !Array.isArray(payload.buffs) || !payload.buffs.every(r=>typeof r.name==='string' && Array.isArray(r.codes) && r.codes.every(c=>typeof c==='string' && /^\d{7}(?:\(Lv\d{1,2}\))?$/i.test(c)))){failed();return;}
   BUFFS.splice(0,BUFFS.length,...payload.buffs);
   cleanup();render();
   foot.textContent='เชื่อมต่อชีทแล้ว · ตรวจข้อมูลล่าสุด '+new Date().toLocaleTimeString('th-TH')+' · อัปเดตทุก 60 วินาที';
 };
 function refresh(){
   if(pending || document.hidden)return;
   pending=true;active=document.createElement('script');
   active.src=endpoint+'?callback=sssFoodBuffs&t='+Date.now();
   active.onerror=failed;timer=setTimeout(failed,25000);document.body.append(active);
 }
 foot.textContent='กำลังเชื่อมต่อชีท…';refresh();
 setInterval(refresh,60000);
 document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh();});
})();
</script></body></html>
